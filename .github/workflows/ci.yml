name: Validate package
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      devcontainer: ${{ steps.paths.outputs.devcontainer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check devcontainer paths
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git hash-object -w -t tree --stdin < /dev/null)
          fi
          if git diff --quiet "$base" "$GITHUB_SHA" -- .devcontainer; then
            echo "devcontainer=false" >> "$GITHUB_OUTPUT"
          else
            echo "devcontainer=true" >> "$GITHUB_OUTPUT"
          fi

  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm test
      - run: npm pack --ignore-scripts
      - run: npm run smoke
      - run: pnpm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: cypress-spec-runner-package-${{ matrix.os }}
          path: '*.tgz'
          if-no-files-found: error

  devcontainer:
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true'
    name: Validate devcontainer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build devcontainer and run project checks
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            pnpm build
            pnpm test
            npm pack --ignore-scripts
            pnpm run smoke
